name: vitaltrack
description: A personal health tracker app — monitor daily metrics, habits & fitness data.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # State Management
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Local Storage (Offline)
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # Navigation
  go_router: ^13.2.1

  # Charts
  fl_chart: ^0.67.0

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Dependency Injection
  get_it: ^7.7.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
